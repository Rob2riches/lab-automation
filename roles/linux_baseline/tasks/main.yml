---
- name: Ensure admin group exists
  ansible.builtin.group:
    name: "{{ linux_baseline_admin_group }}"
    state: present

- name: Install required packages
  ansible.builtin.package:
    name: "{{ linux_baseline_required_packages }}"
    state: present

- name: Deploy SSH banner from template
  ansible.builtin.template:
    src: banner.j2
    dest: "{{ linux_baseline_ssh_banner_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Enforce SSH banner setting
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Banner'
    line: "Banner {{ linux_baseline_ssh_banner_path }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh

- name: Ensure ssh is running and enabled
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
