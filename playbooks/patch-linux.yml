---
- name: Patch Linux hosts
  hosts: linux
  become: true
  serial: 1
  vars:
    allow_reboot: false

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
      register: patch_result

    - name: Remove packages no longer required
      ansible.builtin.apt:
        autoremove: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report reboot status
      ansible.builtin.debug:
        msg: "Reboot required on {{ inventory_hostname }}: {{ reboot_required.stat.exists }}"

    - name: Reboot if required and permitted
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - reboot_required.stat.exists
        - allow_reboot | bool
